<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aventura Encantada das Palavras</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#07152d;color:#fff}
button{font:inherit}.hide{display:none!important}.screen{position:absolute;inset:0}.map{background:url('mapa.jpg') center/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(#00132a12,#00132a55);pointer-events:none}
.start{position:absolute;z-index:9;left:50%;bottom:4%;transform:translateX(-50%);background:#071b3dec;border:2px solid #64d4ff;border-radius:24px;padding:18px 25px;text-align:center;width:min(620px,92vw);box-shadow:0 15px 60px #000c}.start h2{margin:0 0 8px;color:#ffd34e}.start input{width:55%;padding:13px;border:0;border-radius:12px;font-size:18px}.orange{padding:13px 18px;border:0;border-radius:12px;background:#ff9a19;color:#291234;font-weight:900;cursor:pointer}
.hud{position:absolute;z-index:8;top:12px;left:50%;transform:translateX(-50%);background:#071b3de8;border:2px solid #61d0ff;border-radius:22px;padding:9px 18px;font-weight:900;font-size:19px;box-shadow:0 0 22px #00a6ff77}
.portal{position:absolute;z-index:7;width:82px;height:82px;border-radius:50%;border:4px solid #fff;background:#ff8b18cc;color:white;font-size:32px;cursor:pointer;box-shadow:0 0 30px #ffe05c;animation:p 1.5s infinite}.portal.lock{filter:grayscale(1);opacity:.45;animation:none}.p0{left:22%;top:43%}.p1{left:39%;top:46%}.p2{left:56%;top:46%}.p3{left:72%;top:60%}.p4{left:86%;top:39%}@keyframes p{50%{transform:scale(1.12)}}
.tip{position:absolute;z-index:8;bottom:13px;left:50%;transform:translateX(-50%);background:#061a3be8;border:2px solid #64d4ff;border-radius:16px;padding:10px 17px;font-weight:900}
.game{background:url('mapa.jpg') center/cover no-repeat}.game:before{content:"";position:absolute;inset:0;background:#02112dcc;backdrop-filter:blur(5px)}
.card{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1120px,96vw);height:min(760px,91vh);background:linear-gradient(145deg,#0a2855ee,#071a3fee);border:2px solid #62d1ff;border-radius:28px;padding:20px;box-shadow:0 25px 80px #000c;display:flex;flex-direction:column}.title{font-size:29px;font-weight:900;color:#ffd34d}.barbox{height:9px;background:#ffffff20;border-radius:8px;margin:10px 0}.bar{height:100%;background:#ffd43b;border-radius:8px}
.play{flex:1;display:grid;grid-template-columns:44% 56%;gap:18px;min-height:0}.scene{border-radius:22px;background:radial-gradient(circle at 50% 30%,#315aa0,#0c2248 70%);border:1px solid #ffffff40;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.human{width:160px;height:300px;position:absolute;left:18px;bottom:0}.head{position:absolute;width:76px;height:86px;background:#f1b58d;border-radius:48% 48% 45% 45%;left:42px;top:8px;border:5px solid #4a261e}.hair{position:absolute;width:76px;height:35px;background:#4a261e;border-radius:45px 45px 10px 10px;left:42px;top:5px}.body{position:absolute;width:100px;height:135px;background:#7b2bbd;border-radius:38px 38px 20px 20px;left:30px;top:90px}.leg{position:absolute;width:30px;height:85px;background:#25294a;top:210px}.l1{left:45px}.l2{left:85px}.face{position:absolute;z-index:3;left:68px;top:45px;font-size:25px;color:#3a1d1d}
.objectzone{margin-left:125px;text-align:center}.bigword{font-size:72px;font-weight:900;color:#ffd34d;text-shadow:0 5px #4c2372}.sub{font-size:20px;color:#d9efff;margin-top:10px}
.task{display:flex;flex-direction:column;justify-content:center}.question{font-size:27px;font-weight:900;line-height:1.25;margin-bottom:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice,.tile{border:2px solid #69d2ff;border-radius:17px;background:linear-gradient(#2a6db8,#17417c);color:#fff;font-size:25px;font-weight:900;padding:17px;cursor:pointer;box-shadow:0 5px #061735}.choice:hover,.tile:hover{filter:brightness(1.18);transform:translateY(-2px)}
.dragrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px}.tile{min-width:82px}.drop{min-height:80px;border:3px dashed #ffd34d;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:25px;color:#ffe894;margin:12px 0}.feedback{height:45px;font-size:21px;font-weight:900;padding:10px}.hint{align-self:center;border:0;border-radius:12px;padding:10px 15px;background:#f0ddff;color:#35184f;font-weight:900;cursor:pointer}
.final{position:absolute;z-index:20;inset:0;background:#03112dde;display:grid;place-items:center}.finalbox{text-align:center;background:#0c2859f5;border:3px solid #ffd33f;border-radius:30px;padding:38px;box-shadow:0 0 70px #ffd43f77}.finalbox h1{color:#ffd34d;font-size:48px}.trophy{font-size:85px}
@media(max-width:760px){.play{grid-template-columns:1fr}.scene{min-height:210px}.card{overflow:auto}.portal{width:58px;height:58px;font-size:23px}.choices{grid-template-columns:1fr}}
</style></head><body>
<section id="home" class="screen map"><div class="shade"></div><div class="start"><h2>Entre na Aventura</h2><input id="name" placeholder="Nome do estudante"> <button class="orange" id="begin">COMEÇAR</button></div></section>
<section id="map" class="screen map hide"><div class="shade"></div><div class="hud"><span id="player">AVENTUREIRO</span> &nbsp; ⭐ <span id="score">0</span>/15</div>
<button class="portal p0" data-w="0">1</button><button class="portal p1 lock" data-w="1">2</button><button class="portal p2 lock" data-w="2">3</button><button class="portal p3 lock" data-w="3">4</button><button class="portal p4 lock" data-w="4">5</button><div class="tip" id="tip">Entre na Vila das Abóboras</div></section>
<section id="game" class="screen game hide"><div class="card"><div class="title" id="world"></div><div class="barbox"><div class="bar" id="bar"></div></div><div class="play"><div class="scene"><div class="human"><div class="body"></div><div class="leg l1"></div><div class="leg l2"></div><div class="head"></div><div class="hair"></div><div class="face">•‿•</div></div><div class="objectzone"><div class="bigword" id="visual"></div><div class="sub" id="sceneText"></div></div></div><div class="task"><div class="question" id="question"></div><div id="interaction"></div><div class="feedback" id="feedback"></div><button class="hint" id="hint">PISTA MÁGICA</button></div></div></div></section>
<section id="final" class="final hide"><div class="finalbox"><div class="trophy">★ ★ ★</div><h1 id="congrats"></h1><p style="font-size:22px">Você restaurou a magia das palavras e conquistou as 15 estrelas!</p><button class="orange" onclick="location.reload()">JOGAR NOVAMENTE</button></div></section>
<script>
const worlds=["Vila das Abóboras","Floresta dos Fantasmas","Fábrica de Doces","Laboratório da Bruxinha","Castelo das Palavras"];
const q=[
{w:0,v:"ABÓBORA",s:"Uma abóbora luminosa apareceu no caminho.",q:"Toque na letra que inicia ABÓBORA.",o:["A","E","I","O"],a:"A"},
{w:0,v:"ARANHA",s:"Uma teia bloqueia a trilha.",q:"Escolha uma palavra que começa com o mesmo som de ARANHA.",o:["AVIÃO","BOLA","GATO","PATO"],a:"AVIÃO"},
{w:0,v:"ÁRVO_E",s:"Complete a placa para abrir o portão.",q:"Arraste a sílaba que completa ÁRVO_E.",drag:["LA","RE","SA","TO"],a:"RE"},
{w:1,v:"__TO",s:"Um gatinho está escondido na floresta.",q:"Arraste a sílaba inicial para formar GATO.",drag:["BO","GA","PA","LU"],a:"GA"},
{w:1,v:"LUA",s:"A lua ilumina a ponte dos fantasmas.",q:"Qual é a primeira sílaba de LUA?",o:["LA","LU","LE","LI"],a:"LU"},
{w:1,v:"SA...",s:"Escute o som inicial.",q:"Qual palavra começa com SA?",o:["SAPO","GATO","MALA","BOLA"],a:"SAPO"},
{w:2,v:"ESTRELA",s:"A máquina de doces precisa de uma palavra.",q:"Qual palavra nomeia algo que brilha no céu e tem pontas?",o:["LUA","SOL","ESTRELA","NUVEM"],a:"ESTRELA"},
{w:2,v:"CASA",s:"Monte a palavra para ligar a máquina.",q:"Arraste a primeira sílaba de CASA.",drag:["SA","CA","ZA","AS"],a:"CA"},
{w:2,v:"BOLA",s:"Um prêmio está escondido entre os doces.",q:"Qual palavra usamos para nomear o objeto redondo usado em jogos?",o:["BOLA","PATO","CASA","GATO"],a:"BOLA"},
{w:3,v:"GATO",s:"A poção só aceita palavras bem organizadas.",q:"Qual escrita está correta?",o:["GTAO","GATO","AGTO","GOAT"],a:"GATO"},
{w:3,v:"CA • SA",s:"Bata palmas para separar as partes.",q:"Qual palavra tem duas sílabas?",o:["SOL","CASA","BORBOLETA","AVIÃO"],a:"CASA"},
{w:3,v:"BO • LA",s:"Descubra o final da palavra.",q:"Qual palavra termina com LA?",o:["BOLA","GATO","CASA","PATO"],a:"BOLA"},
{w:4,v:"M...",s:"Primeira chave do castelo.",q:"Escolha a palavra que começa com M.",o:["MALA","BOLA","SAPO","GATO"],a:"MALA"},
{w:4,v:"CA__",s:"Segunda chave do castelo.",q:"Arraste a sílaba que forma CASA.",drag:["TO","SA","LU","BO"],a:"SA"},
{w:4,v:"LUA",s:"A última porta está diante de você.",q:"DESAFIO FINAL: qual palavra representa o astro que costuma aparecer à noite?",o:["ESTRELA","LUA","SOL","CASA"],a:"LUA"}];
let name="",i=0,stars=0,unlocked=0,busy=false;const $=s=>document.querySelector(s);
function speak(t){try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="pt-BR";u.rate=.88;speechSynthesis.speak(u)}catch(e){}}
$("#begin").onclick=()=>{name=$("#name").value.trim();if(!name){alert("Digite o nome do estudante.");return}$("#player").textContent=name.toUpperCase();$("#home").classList.add("hide");showMap();speak("Olá "+name+". Sua aventura vai começar!")};
function showMap(){ $("#game").classList.add("hide");$("#map").classList.remove("hide");document.querySelectorAll(".portal").forEach((b,n)=>{b.classList.toggle("lock",n>unlocked);b.disabled=n>unlocked});$("#score").textContent=stars}
document.querySelectorAll(".portal").forEach(b=>b.onclick=()=>{let w=+b.dataset.w;if(w>unlocked)return;i=q.findIndex(x=>x.w===w);$("#map").classList.add("hide");$("#game").classList.remove("hide");render()});
function render(){busy=false;let x=q[i];$("#world").textContent=(x.w+1)+". "+worlds[x.w]+" • "+((i%3)+1)+"/3";$("#bar").style.width=((i+1)/15*100)+"%";$("#visual").textContent=x.v;$("#sceneText").textContent=x.s;$("#question").textContent=x.q;$("#feedback").textContent="";let box=$("#interaction");box.innerHTML="";
if(x.o){let d=document.createElement("div");d.className="choices";x.o.forEach(t=>{let b=document.createElement("button");b.className="choice";b.textContent=t;b.onclick=()=>answer(t,b);d.appendChild(b)});box.appendChild(d)}
else{let row=document.createElement("div");row.className="dragrow";x.drag.forEach(t=>{let b=document.createElement("button");b.className="tile";b.textContent=t;b.draggable=true;b.ondragstart=e=>e.dataTransfer.setData("text/plain",t);b.onclick=()=>answer(t,b);row.appendChild(b)});let drop=document.createElement("div");drop.className="drop";drop.textContent="ARRASTE AQUI";drop.ondragover=e=>e.preventDefault();drop.ondrop=e=>{e.preventDefault();answer(e.dataTransfer.getData("text/plain"),drop)};box.append(row,drop)}setTimeout(()=>speak(x.q),200)}
function answer(v,b){if(busy)return;let x=q[i];if(v===x.a){busy=true;stars++;b.style.background="#168b51";$("#feedback").textContent="★ MUITO BEM! Estrela conquistada!";speak("Muito bem, "+name+"!");setTimeout(next,900)}else{$("#feedback").textContent="Quase! Observe a pista e tente novamente.";speak("Quase. Tente novamente.")}}
function next(){let old=q[i].w;i++;if(i>=q.length){$("#game").classList.add("hide");$("#final").classList.remove("hide");$("#congrats").textContent="PARABÉNS, "+name.toUpperCase()+"!";speak("Parabéns "+name+". Você completou a aventura encantada das palavras!");return}let nw=q[i].w;if(nw!==old){unlocked=nw;$("#tip").textContent="NOVO MUNDO LIBERADO: "+worlds[nw];showMap();speak("Novo mundo liberado. "+worlds[nw])}else render()}
$("#hint").onclick=()=>{let x=q[i];let h=x.a.length<=2?"Fale a palavra devagar e escute cada pedaço.":"Observe o som inicial e as letras da palavra.";$("#feedback").textContent="PISTA: "+h;speak(h)}
</script></body></html>
